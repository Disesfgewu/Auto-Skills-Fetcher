<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto-Skills-Fetcher — 互動式 AI 助手指揮中心</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" defer></script>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #1e293b;
      --border: #273449;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --purple: #a78bfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: rgba(11, 17, 32, 0.96);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .brand h1 { margin: 0; font-size: 16px; font-weight: 700; }
    .brand .sub { font-size: 11px; color: var(--muted); }
    .pack-pill {
      padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
      background: rgba(167, 139, 250, 0.16); color: #c4b5fd; border: 1px solid rgba(167, 139, 250, 0.4);
    }
    .rag-badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; }
    .rag-GREEN { background: rgba(34, 197, 94, 0.18); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.45); }
    .rag-AMBER { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.45); }
    .rag-RED { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.5); }
    .sync-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--muted);
      background: var(--surface); border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 999px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(350px, 0.95fr);
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    @media (max-width: 980px) {
      body { height: auto; overflow: auto; }
      .workspace { grid-template-columns: 1fr; overflow: visible; }
      .chat-pane { height: 70vh; border-left: none; border-top: 1px solid var(--border); }
    }
    .board-pane { overflow-y: auto; padding: 16px 20px 40px; min-height: 0; }
    .chat-pane { display: flex; flex-direction: column; border-left: 1px solid var(--border); background: #0d1424; min-height: 0; }
    .chat-header { padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
    .chat-header-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .engine-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .engine-btn {
      background: var(--bg); color: var(--muted); border: 1px solid var(--border);
      border-radius: 7px; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .engine-btn.active { background: rgba(56, 189, 248, 0.16); color: var(--accent); border-color: var(--accent); }
    .engine-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .quick-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--border); background: rgba(17, 24, 39, 0.6); }
    .chip { background: var(--surface-2); color: #cbd5e1; border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 12px; border-radius: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-word; max-width: 95%; }
    .msg-user { align-self: flex-end; background: rgba(56, 189, 248, 0.18); border: 1px solid rgba(56, 189, 248, 0.35); color: #e0f2fe; }
    .msg-assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .msg-meta { font-size: 10px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .chat-input-area { padding: 10px 12px; border-top: 1px solid var(--border); background: var(--surface); display: flex; gap: 8px; align-items: flex-end; }
    .chat-input-area textarea { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; resize: none; min-height: 42px; max-height: 120px; }
    .send-btn { background: var(--accent); color: #082f49; border: none; border-radius: 8px; padding: 10px 14px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .send-btn:disabled { opacity: 0.5; cursor: wait; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; }
    .kpi .label { font-size: 11px; color: var(--muted); }
    .kpi .value { font-size: 22px; font-weight: 700; }
    .kpi .hint { font-size: 11px; color: var(--muted); }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab-btn { background: var(--surface); color: var(--muted); border: 1px solid var(--border); border-radius: 7px; padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: rgba(56, 189, 248, 0.15); color: var(--accent); border-color: var(--accent); }
    .panel { display: none; }
    .panel.active { display: block; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .card h2 { margin: 0 0 10px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .bar-track { width: 100%; height: 9px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 6px 0; }
    .bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
    .fill-green { background: linear-gradient(90deg, #16a34a, #4ade80); }
    .fill-amber { background: linear-gradient(90deg, #d97706, #fbbf24); }
    .fill-red { background: linear-gradient(90deg, #dc2626, #f87171); }
    .fill-blue { background: linear-gradient(90deg, #0284c7, #38bdf8); }
    .tag { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: 600; margin-right: 4px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
    .st-done, .st-passed, .st-ready, .st-included, .st-sent { background: rgba(34, 197, 94, 0.15); color: #4ade80; border-color: rgba(34, 197, 94, 0.35); }
    .st-in_progress, .st-running, .st-drafting, .st-screened { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border-color: rgba(56, 189, 248, 0.35); }
    .st-in_review, .st-visual_qa, .st-awaiting_approval, .st-warning { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border-color: rgba(245, 158, 11, 0.4); }
    .st-blocked, .st-needs_rework, .st-failed, .st-excluded, .st-P0 { background: rgba(239, 68, 68, 0.18); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
    .st-todo, .st-pending, .st-draft, .st-outline, .st-crawled, .st-P1 { background: rgba(148, 163, 184, 0.14); color: #cbd5e1; border-color: rgba(148, 163, 184, 0.3); }
    .member-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .member-card.overload { border-color: rgba(239, 68, 68, 0.65); }
    .member-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .task-row { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-top: 7px; display: flex; flex-direction: column; gap: 5px; }
    .task-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
    .task-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; font-size: 11px; }
    .alert { padding: 8px 10px; border-radius: 7px; margin-bottom: 7px; font-size: 12px; }
    .alert-red { background: rgba(239, 68, 68, 0.14); border: 1px solid rgba(239, 68, 68, 0.45); color: #fecaca; }
    .alert-amber { background: rgba(245, 158, 11, 0.14); border: 1px solid rgba(245, 158, 11, 0.45); color: #fde68a; }
    .alert-green { background: rgba(34, 197, 94, 0.14); border: 1px solid rgba(34, 197, 94, 0.4); color: #bbf7d0; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-size: 10px; text-transform: uppercase; }
    .gantt-row { display: grid; grid-template-columns: 190px 1fr 78px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
    .gantt-track { position: relative; height: 20px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
    .gantt-bar { position: absolute; top: 3px; height: 14px; border-radius: 3px; font-size: 10px; padding: 0 5px; line-height: 14px; color: #fff; white-space: nowrap; overflow: hidden; }
    .gantt-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); z-index: 2; }
    pre.doc-box { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 12px; color: #cbd5e1; max-height: 440px; overflow: auto; }
    .mermaid-wrap { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto; margin-bottom: 10px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div>
        <h1 id="project-title">Interactive Assistant</h1>
        <div class="sub" id="hub-path">Loading workspace...</div>
      </div>
      <span id="pack-pill" class="pack-pill">project-mgmt</span>
      <span id="rag-badge" class="rag-badge rag-GREEN">GREEN</span>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <span class="sync-pill"><span class="dot"></span><span id="sync-status">Live sync</span></span>
      <button class="tab-btn" onclick="refreshState(true)">重新整理</button>
    </div>
  </header>

  <div class="workspace">
    <!-- LEFT: DYNAMIC VISUAL BOARD (ADAPTS TO PM / ACADEMIC / SECRETARY PACK) -->
    <div class="board-pane">
      <section class="kpi-grid" id="kpi-grid"></section>
      <div class="tabs" id="tabs-bar"></div>
      <div id="board-panels"></div>
    </div>

    <!-- RIGHT: INTERACTIVE AI ASSISTANT POWERED BY AGY / CLAUDE CODE / CODEX -->
    <aside class="chat-pane">
      <div class="chat-header">
        <div class="chat-header-top">
          <strong style="font-size:14px;" id="assistant-title">🤖 互動式 AI 助手</strong>
          <button class="tab-btn" style="padding:3px 8px;font-size:11px;" onclick="resetChat()">新對話</button>
        </div>
        <div class="engine-pills">
          <button class="engine-btn" data-agent="agy" onclick="selectAgent('agy')">⚡ Antigravity (agy)</button>
          <button class="engine-btn" data-agent="claude" onclick="selectAgent('claude')">🟣 Claude Code</button>
          <button class="engine-btn" data-agent="codex" onclick="selectAgent('codex')">🟢 Codex</button>
        </div>
      </div>

      <div class="quick-chips" id="quick-chips"></div>

      <div class="chat-messages" id="chat-messages">
        <div class="msg msg-assistant">
          <div class="msg-meta">系統提示</div>
          已連接本機 CLI 引擎！可隨時切換 <strong>Antigravity (agy)</strong>、<strong>Claude Code</strong> 或 <strong>Codex</strong> 下指令，助手更新工作區檔案後，左側視覺化看板會即時刷新。
        </div>
      </div>

      <div class="chat-input-area">
        <textarea id="chat-input" placeholder="直接對助手下指令（Enter 送出，Shift+Enter 換行）..." onkeydown="handleChatKey(event)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendChat()">送出</button>
      </div>
    </aside>
  </div>

  <script>
    let STATE = null;
    let ACTIVE_AGENT = 'agy';
    let ACTIVE_TAB = null;
    let SENDING = false;
    let LAST_PACK = '';
    let LAST_MERMAID_SRC = '';
    let LAST_MSG_COUNT = -1;

    const PACK_CONFIG = {
      'project-mgmt': {
        label: '📋 專案管理助手',
        tabs: [
          { id: 't1', label: '👥 人力分配與負荷' },
          { id: 't2', label: '🎯 目標↔任務與時間軸' },
          { id: 't3', label: '✅ 品質硬閘門與風險' },
          { id: 't4', label: '🗺️ 架構圖與計劃書' },
          { id: 't5', label: '🐙 GitHub 連動與審批' }
        ],
        chips: [
          { label: '🔍 健檢進度與方向', prompt: '請根據 project-hub/ 健檢目前專案方向、時間進度、架構圖與計劃書，列出紅黃綠燈風險與處置建議。' },
          { label: '⚖️ 平衡人力負荷', prompt: '請分析每位成員的工作負荷與每週產能，找出超載或閒置人力並提出具體改派方案；必要時直接調整 tasks.yaml。' },
          { label: '✅ 審查產出品質', prompt: '請執行產出品質硬閘門審查，檢查所有任務的 acceptance_criteria、qa_status 與 evidence 是否達標。' },
          { label: '🐙 唯讀分析 GitHub Issues/PR', prompt: '請根據 github_snapshot.yaml（嚴禁自行推送或修改 GitHub）比對 Open Issues / PRs 與 tasks.yaml，指出未納入追蹤的項目；若有建議操作請只寫入 pending_github_actions.yaml 等我核准。' }
        ]
      },
      'academic-research': {
        label: '🎓 學術研究助手',
        tabs: [
          { id: 't1', label: '📈 研究進度與實驗測試' },
          { id: 't2', label: '📚 論文庫與文獻爬取' },
          { id: 't3', label: '🛡️ 學術倫理與引文稽核' },
          { id: 't4', label: '📝 研究計劃書與流程圖' }
        ],
        chips: [
          { label: '📈 健檢研究進度', prompt: '請根據 research-hub/ 盤點目前各研究階段里程碑、實驗進度與逾期風險，並建議下一步行動。' },
          { label: '📥 整理／擴充文獻庫', prompt: '請檢查 papers.yaml 目前收錄與篩選狀態，指出尚未完成 DOI/arXiv 查核的論文並整理 PRISMA 文獻缺口。' },
          { label: '🧪 分析實驗與基準測試', prompt: '請分析 experiments.yaml 的基準測試數據、vs Baseline 提升幅度與可重現性設定，建議下一組消融或對照實驗。' },
          { label: '🛡️ 檢查學術倫理與引文', prompt: '請依據 ethics_audit.yaml 執行學術倫理、原創性/抄襲風險、資料爬取合規與引文真實性稽核。' }
        ]
      },
      'exec-secretary-deck': {
        label: '🗂️ 個人秘書與簡報助手',
        tabs: [
          { id: 't1', label: '📅 今日行程與會議待辦' },
          { id: 't2', label: '📊 簡報與視覺交付物' },
          { id: 't3', label: '✉️ 溝通草稿與外寄審批' },
          { id: 't4', label: '📰 主管簡報與決策備忘' }
        ],
        chips: [
          { label: '📅 整理今日行程與待辦', prompt: '請根據 secretary-hub/ 整理近期重要會議行程、準備狀態與 P0/P1 待辦追蹤清單。' },
          { label: '📊 檢核簡報進度與架構', prompt: '請檢視 decks.yaml 中每份簡報的截止日、目標受眾、投影片架構與視覺檢核備註，給出優化建議。' },
          { label: '📝 彙整會議紀要追蹤', prompt: '請檢查 action_items.yaml 尚未完成與即將到期的會議待辦，整理跟催提醒清單。' },
          { label: '✉️ 起草／檢核外寄草稿', prompt: '請檢視 comms_drafts.yaml 待審批的外寄信件與內部公告草稿，優化措辭並維持 awaiting_approval 等待我確認。' }
        ]
      }
    };

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':"&quot;","'":'&#39;' }[c]));
    }

    function switchTab(id) {
      ACTIVE_TAB = id;
      document.querySelectorAll('.tab-btn[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
      document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
      if (id === 't4') renderMermaid();
    }

    function selectAgent(agent) {
      ACTIVE_AGENT = agent;
      document.querySelectorAll('.engine-btn').forEach(b => b.classList.toggle('active', b.dataset.agent === agent));
    }

    function handleChatKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
    }

    function quickAsk(text) {
      document.getElementById('chat-input').value = text;
      sendChat();
    }

    async function resetChat() {
      await fetch('/api/chat/reset', { method: 'POST' });
      LAST_MSG_COUNT = -1;
      await refreshState(true);
    }

    async function sendChat() {
      if (SENDING) return;
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      SENDING = true;
      input.value = '';
      const btn = document.getElementById('send-btn');
      btn.disabled = true; btn.textContent = '思考中...';

      const box = document.getElementById('chat-messages');
      box.insertAdjacentHTML('beforeend', `
        <div class="msg msg-user"><div class="msg-meta">你 -> ${esc(ACTIVE_AGENT)}</div>${esc(text)}</div>
        <div class="msg msg-assistant" id="pending-msg"><div class="msg-meta">🤖 ${esc(ACTIVE_AGENT)} 執行中...</div>正在分析工作區並處理你的指示，請稍候...</div>
      `);
      box.scrollTop = box.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, agent: ACTIVE_AGENT })
        });
        const data = await res.json();
        const pending = document.getElementById('pending-msg');
        if (pending) pending.remove();
        if (data.state) {
          STATE = data.state;
          LAST_MSG_COUNT = -1;
          renderAll(true);
        } else {
          await refreshState(true);
          if (!data.ok && data.error) {
            box.insertAdjacentHTML('beforeend', `<div class="msg msg-assistant"><div class="msg-meta">錯誤</div>${esc(data.error)}</div>`);
          }
        }
      } catch (err) {
        const pending = document.getElementById('pending-msg');
        if (pending) pending.textContent = '請求失敗: ' + err.message;
      } finally {
        SENDING = false; btn.disabled = false; btn.textContent = '送出';
      }
    }

    async function updateTaskField(taskId, patch) {
      const res = await fetch('/api/tasks/update', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task_id: taskId, ...patch })
      });
      if (res.ok) await refreshState(true);
    }

    async function updatePackItem(kind, id, patch) {
      const res = await fetch('/api/items/update', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind, id, ...patch })
      });
      if (res.ok) await refreshState(true);
    }

    async function syncGitHubReadonly() {
      const repoInput = document.getElementById('gh-repo-input');
      const repo = repoInput ? repoInput.value.trim() : '';
      const btn = document.getElementById('gh-sync-btn');
      if (btn) { btn.disabled = true; btn.textContent = '唯讀同步中...'; }
      try {
        const res = await fetch('/api/github/sync', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repo })
        });
        const data = await res.json();
        if (!data.ok) alert('GitHub 唯讀同步失敗: ' + (data.error || 'unknown'));
        await refreshState(true);
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = '🔄 唯讀同步 GitHub'; }
      }
    }

    async function approveGitHubProposal(pid, title) {
      if (!confirm(`確認核准並執行 GitHub 操作 [${pid}]：${title}？\n（註：git push 永遠不會自動執行）`)) return;
      const res = await fetch('/api/github/approve', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ proposal_id: pid, explicit_approval: true })
      });
      const data = await res.json();
      if (!data.ok) alert('執行失敗: ' + (data.error || 'unknown'));
      else if (data.message) alert(data.message);
      await refreshState(true);
    }

    async function rejectGitHubProposal(pid) {
      await fetch('/api/github/reject', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ proposal_id: pid })
      });
      await refreshState(true);
    }

    async function refreshState(force = false) {
      try {
        const res = await fetch('/api/state?_=' + Date.now());
        STATE = await res.json();
        document.getElementById('sync-status').textContent = '已同步 ' + new Date().toLocaleTimeString();
        renderAll(force);
      } catch (_) {
        document.getElementById('sync-status').textContent = '重連中...';
      }
    }

    function initChromeForPack(pack) {
      const cfg = PACK_CONFIG[pack] || PACK_CONFIG['project-mgmt'];
      document.getElementById('pack-pill').textContent = pack;
      document.getElementById('assistant-title').textContent = cfg.label;
      document.getElementById('tabs-bar').innerHTML = cfg.tabs.map((t, i) =>
        `<button class="tab-btn ${i === 0 ? 'active' : ''}" data-tab="${t.id}" onclick="switchTab('${t.id}')">${esc(t.label)}</button>`
      ).join('');
      document.getElementById('quick-chips').innerHTML = cfg.chips.map((c, idx) =>
        `<button class="chip" data-chip-idx="${idx}">${esc(c.label)}</button>`
      ).join('');
      document.querySelectorAll('#quick-chips .chip').forEach(btn => {
        btn.addEventListener('click', () => quickAsk(cfg.chips[Number(btn.dataset.chipIdx)].prompt));
      });
      document.getElementById('board-panels').innerHTML = cfg.tabs.map((t, i) =>
        `<section id="panel-${t.id}" class="panel ${i === 0 ? 'active' : ''}"></section>`
      ).join('');
      ACTIVE_TAB = 't1';
    }

    function renderAll(force = false) {
      if (!STATE) return;
      const pack = STATE.pack || 'project-mgmt';
      if (pack !== LAST_PACK) {
        LAST_PACK = pack;
        initChromeForPack(pack);
      }

      const audit = STATE.audit || {};
      const assistant = STATE.assistant || {};
      if (assistant.active_agent && LAST_MSG_COUNT === -1) ACTIVE_AGENT = assistant.active_agent;
      const avail = assistant.available_agents || {};
      document.querySelectorAll('.engine-btn').forEach(b => {
        const ag = b.dataset.agent;
        b.disabled = avail[ag] === false;
        b.classList.toggle('active', ag === ACTIVE_AGENT);
      });

      const msgs = assistant.messages || [];
      if (!SENDING && msgs.length !== LAST_MSG_COUNT) {
        LAST_MSG_COUNT = msgs.length;
        const box = document.getElementById('chat-messages');
        if (msgs.length > 0) {
          box.innerHTML = msgs.map(m => `
            <div class="msg msg-${m.role === 'user' ? 'user' : 'assistant'}">
              <div class="msg-meta">${m.role === 'user' ? '你 -> ' + esc(m.agent || '') : '🤖 ' + esc(m.agent || '')}</div>
              ${esc(m.content || '')}
            </div>
          `).join('');
          box.scrollTop = box.scrollHeight;
        }
      }

      document.getElementById('project-title').textContent = STATE.project_name || pack;
      document.getElementById('hub-path').textContent = 'Hub: ' + (STATE.hub_path || '') + ' | 基準日: ' + (audit.as_of || '');
      const rag = audit.rag_status || 'GREEN';
      const badge = document.getElementById('rag-badge');
      badge.textContent = 'RAG: ' + rag;
      badge.className = 'rag-badge rag-' + rag;

      if (pack === 'academic-research') renderAcademicBoard(force);
      else if (pack === 'exec-secretary-deck') renderSecretaryBoard(force);
      else renderPMBoard(force);
    }

    function renderAlertsHtml(audit) {
      const reds = (audit.red_issues || []).map(x => `<div class="alert alert-red">🚨 ${esc(x)}</div>`);
      const ambers = (audit.amber_issues || []).map(x => `<div class="alert alert-amber">⚠️ ${esc(x)}</div>`);
      return (reds.length || ambers.length) ? reds.concat(ambers).join('') : '<div class="alert alert-green">✅ 目前所有檢核項目全數通過！</div>';
    }

    /* ==================== 1. PROJECT-MGMT VIEW ==================== */
    function renderPMBoard(force) {

      const tasks = STATE.tasks || [];

      const members = STATE.team || [];

      const overloadAlerts = (audit.amber_issues || []).filter(x => x.includes('[OVERLOAD]') || x.includes('[UNASSIGNED]')).map(a => `<div class="alert alert-amber">${esc(a)}</div>`).join('');
      const unassigned = tasks.filter(t => !t.assignee || !memberIds.includes(t.assignee));

      const objAudit = Object.fromEntries((audit.objectives || []).map(o => [o.id, o]));
      const todayMs = new Date((audit.as_of || new Date().toISOString().slice(0, 10)) + 'T00:00:00').getTime();
      const dated = tasks.filter(t => t.due_date).map(t => ({ ...t, dueMs: new Date(t.due_date + 'T00:00:00').getTime() }));
      let ganttHtml = '<div style="color:var(--muted);font-size:12px;">尚無具截止日任務</div>';

      document.getElementById('panel-t3').innerHTML = `

        <div class="card"><h2>📋 產出品質檢核表</h2><div style="overflow:auto;"><table><thead><tr><th>任務</th><th>目標</th><th>負責人</th><th>狀態/QA</th><th>驗收標準</th><th>驗證證據</th></tr></thead><tbody>
          ${tasks.map(t => `<tr><td><strong>${esc(t.id)}</strong><br/>${esc(t.title)}</td><td><span class="tag">${esc(t.objective_id || '-')}</span></td><td>${esc(t.assignee || '-')}</td><td><span class="tag st-${esc(t.status)}">${esc(t.status)}</span><br/><span class="tag st-${esc(t.qa_status)}">QA:${esc(t.qa_status)}</span></td><td>${(t.acceptance_criteria || []).map(c => `<div>${c.passed ? '✅' : '⬜'} ${esc(c.criterion)}</div>`).join('') || '-'}</td><td>${(t.evidence || []).map(e => `<div>• ${esc(e)}</div>`).join('') || '-'}</td></tr>`).join('')}

      renderMermaidDocPanel(STATE.architecture_md || '', STATE.charter_md || '', '🗺️ 完整架構圖（ARCHITECTURE.md）', '📑 專案計劃書（CHARTER.md）', force);

      const gh = STATE.github || {};
      const ghIssues = gh.issues || [];
      const ghPrs = gh.pull_requests || [];
      const ghMs = gh.milestones || [];
      const ghCi = gh.ci_runs || [];

      const t5 = document.getElementById('panel-t5');
      if (t5) {

              </tbody></table>` : '<div style="font-size:12px;color:var(--muted);">尚無同步到的 Issues（點上方「唯讀同步 GitHub」抓取）</div>'}

              <h2>🔀 Pull Requests & CI（唯讀）</h2>

                ${ghPrs.slice(0, 10).map(p => `<tr><td><a href="${esc(p.url)}" target="_blank" style="color:var(--accent)">#${esc(p.number)}</a></td><td>${esc(p.title)}</td><td><code>${esc(p.head_branch)}</code></td><td><span class="tag st-${p.state === 'merged' ? 'done' : 'in_progress'}">${esc(p.state)}</span></td></tr>`).join('')}

            </div>

                    ${msStatuses.map(st => `<option value="${st}" ${m.status === st ? 'selected' : ''}>${st}</option>`).join('')}

              </div>
              <div class="bar-track"><div class="bar-fill fill-blue" style="width:${Number(m.completion_pct) || 0}%"></div></div>

            </div>`).join('')}
        </div>
        <div class="card"><h2>🧪 實驗與基準測試追蹤表</h2><div style="overflow:auto;"><table>
          <thead><tr><th>ID</th><th>實驗名稱</th><th>方法</th><th>資料集</th><th>主要指標</th><th>vs Baseline</th><th>可重現</th><th>狀態</th></tr></thead>
          <tbody>${exps.map(e => `<tr><td><strong>${esc(e.id)}</strong></td><td>${esc(e.name)}</td><td>${esc(e.method)}</td><td>${esc(e.dataset)}</td><td><strong>${esc(e.primary_metric)}</strong></td><td style="color:var(--green)">${esc(e.baseline_delta)}</td><td>${e.reproducible ? '✅' : '⚠️'}</td><td><span class="tag st-${esc(e.status)}">${esc(e.status)}</span></td></tr>`).join('')}</tbody>
        </table></div></div>
      `;

      const pStatuses = ['crawled', 'screened', 'included', 'excluded'];
      document.getElementById('panel-t2').innerHTML = `
        <div class="card"><h2>📚 學術論文爬取與 PRISMA 篩選庫（共 ${papers.length} 篇）</h2><div style="overflow:auto;"><table>
          <thead><tr><th>ID</th><th>論文標題與作者</th><th>來源 (arXiv/DOI)</th><th>引文查核</th><th>篩選狀態</th><th>核心發現</th></tr></thead>
          <tbody>${papers.map(p => `<tr>
            <td><strong>${esc(p.id)}</strong></td>
            <td><strong>${esc(p.title)}</strong><div style="color:var(--muted);font-size:11px;">${esc(p.authors)} (${esc(p.year)})</div></td>
            <td><span class="tag">${esc(p.source)}</span></td>
            <td>${p.citation_verified ? '<span class="tag st-passed">✅ 已查核</span>' : '<span class="tag st-warning">⚠️ 待查核</span>'}</td>
            <td><select onchange="updatePackItem('paper','${esc(p.id)}',{status:this.value})">${pStatuses.map(st => `<option value="${st}" ${p.status === st ? 'selected' : ''}>${st}</option>`).join('')}</select></td>
            <td>${esc(p.key_finding || '')}</td>
          </tr>`).join('')}</tbody>
        </table></div></div>
      `;

      const eStatuses = ['pending', 'warning', 'passed', 'failed'];
      document.getElementById('panel-t3').innerHTML = `
        <div class="card"><h2>🚨 研究風險與合規警訊</h2>${renderAlertsHtml(audit)}</div>
        <div class="card"><h2>🛡️ 學術倫理、原創性與可重現性檢查表</h2><table>
          <thead><tr><th>ID</th><th>類別</th><th>檢核項目</th><th>狀態</th><th>佐證紀錄</th></tr></thead>
          <tbody>${checks.map(c => `<tr>
            <td><strong>${esc(c.id)}</strong></td>
            <td><span class="tag">${esc(c.category)}</span></td>
            <td>${esc(c.item)}</td>
            <td><select onchange="updatePackItem('ethics','${esc(c.id)}',{status:this.value})">${eStatuses.map(st => `<option value="${st}" ${c.status === st ? 'selected' : ''}>${st}</option>`).join('')}</select></td>
            <td>${esc(c.evidence || '')}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      `;

      renderMermaidDocPanel(STATE.proposal_md || '', '', '📝 研究計劃書與方法流程圖（PROPOSAL.md）', '', force);
    }

    /* ==================== 3. EXEC-SECRETARY-DECK VIEW ==================== */
    function renderSecretaryBoard(force) {
      const audit = STATE.audit || {};
      const events = STATE.events || [];
      const items = STATE.action_items || [];
      const decks = STATE.decks || [];
      const drafts = STATE.comms_drafts || [];

      const openItems = items.filter(i => i.status !== 'done').length;
      const readyDecks = decks.filter(d => d.status === 'ready').length;
      const awaiting = drafts.filter(d => d.status === 'awaiting_approval').length;

      document.getElementById('kpi-grid').innerHTML = `
        <div class="kpi"><div class="label">近期重要會議</div><div class="value" style="color:var(--accent)">${events.length}</div><div class="hint">已就緒 ${events.filter(e => e.prep_status === 'ready').length} 場</div></div>
        <div class="kpi"><div class="label">進行中會議待辦</div><div class="value" style="color:var(--amber)">${openItems}</div><div class="hint">總計 ${items.length} 項</div></div>
        <div class="kpi"><div class="label">簡報定稿進度</div><div class="value" style="color:var(--green)">${readyDecks} / ${decks.length}</div><div class="hint">投影片交付物</div></div>
        <div class="kpi"><div class="label">待主管審批草稿</div><div class="value" style="color:${awaiting ? 'var(--amber)' : 'var(--green)'}">${awaiting}</div><div class="hint">外寄前安全確認</div></div>
      `;

      const aStatuses = ['todo', 'in_progress', 'done'];
      document.getElementById('panel-t1').innerHTML = `
        <div class="card"><h2>📅 行程與重要會議排程</h2>
          <div class="grid-2">${events.map(e => `
            <div class="member-card">
              <div class="member-head"><strong>${esc(e.title)}</strong><span class="tag st-${esc(e.prep_status)}">${esc(e.prep_status)}</span></div>
              <div style="font-size:12px;color:var(--muted);margin-top:4px;">🗓️ ${esc(e.date)} ${esc(e.time)} · 📍 ${esc(e.location || '-')}</div>
              <div style="margin-top:6px;">${(e.attendees || []).map(a => `<span class="tag">👤 ${esc(a)}</span>`).join('')}${e.deck_linked ? `<span class="tag">📊 ${esc(e.deck_linked)}</span>` : ''}</div>
            </div>`).join('')}
          </div>
        </div>
        <div class="card"><h2>✅ 會議紀要待辦追蹤</h2><table>
          <thead><tr><th>ID</th><th>來源會議</th><th>待辦事項</th><th>負責人</th><th>截止日</th><th>優先級</th><th>狀態</th></tr></thead>
          <tbody>${items.map(it => `<tr>
            <td><strong>${esc(it.id)}</strong></td><td>${esc(it.meeting)}</td><td>${esc(it.task)}</td><td>${esc(it.owner)}</td><td>${esc(it.due_date)}</td>
            <td><span class="tag st-${esc(it.priority)}">${esc(it.priority)}</span></td>
            <td><select onchange="updatePackItem('action_item','${esc(it.id)}',{status:this.value})">${aStatuses.map(st => `<option value="${st}" ${it.status === st ? 'selected' : ''}>${st}</option>`).join('')}</select></td>
          </tr>`).join('')}</tbody>
        </table></div>
      `;

      const dStatuses = ['outline', 'drafting', 'visual_qa', 'ready'];
      document.getElementById('panel-t2').innerHTML = `
        <div class="card"><h2>📊 簡報與視覺交付物看板</h2><div class="grid-2">
          ${decks.map(d => `
            <div class="member-card">
              <div class="member-head"><strong>${esc(d.id)} · ${esc(d.title)}</strong>
                <select onchange="updatePackItem('deck','${esc(d.id)}',{status:this.value})">${dStatuses.map(st => `<option value="${st}" ${d.status === st ? 'selected' : ''}>${st}</option>`).join('')}</select>
              </div>
              <div style="margin:6px 0;"><span class="tag">受眾: ${esc(d.audience)}</span><span class="tag">主題: ${esc(d.theme)}</span><span class="tag">${esc(d.slides_count)} 頁</span><span class="tag">截止 ${esc(d.due_date)}</span></div>
              <div style="font-size:12px;color:var(--muted);">檔案: <code>${esc(d.file_path || '-')}</code></div>
              <div style="font-size:12px;color:#fde68a;margin-top:4px;">審校備註: ${esc(d.review_notes || '無')}</div>
            </div>`).join('')}
        </div></div>
      `;

      const cStatuses = ['draft', 'awaiting_approval', 'sent'];
      document.getElementById('panel-t3').innerHTML = `
        <div class="card"><h2>🚨 待辦與外寄審批提醒</h2>${renderAlertsHtml(audit)}</div>
        <div class="card"><h2>✉️ 溝通與信件草稿（外寄前須主管核准）</h2><table>
          <thead><tr><th>ID</th><th>管道</th><th>收件對象</th><th>主旨與摘要</th><th>狀態</th></tr></thead>
          <tbody>${drafts.map(dr => `<tr>
            <td><strong>${esc(dr.id)}</strong></td><td><span class="tag">${esc(dr.channel)}</span></td><td>${esc(dr.recipient)}</td>
            <td><strong>${esc(dr.subject)}</strong><div style="color:var(--muted);font-size:11px;">${esc(dr.summary)}</div></td>
            <td><select onchange="updatePackItem('draft','${esc(dr.id)}',{status:this.value})">${cStatuses.map(st => `<option value="${st}" ${dr.status === st ? 'selected' : ''}>${st}</option>`).join('')}</select></td>
          </tr>`).join('')}</tbody>
        </table></div>
      `;

      renderMermaidDocPanel('', STATE.briefing_md || '', '', '📰 主管每日簡報與決策備忘（BRIEFING.md）', force);
    }

    function renderMermaidDocPanel(mermaidDoc, secondDoc, title1, title2, force) {
      let html = '';
      if (title1) html += `<div class="card"><h2>${esc(title1)}</h2><div id="mermaid-container"></div><pre class="doc-box">${esc(mermaidDoc || '(尚未建立)')}</pre></div>`;
      if (title2) html += `<div class="card"><h2>${esc(title2)}</h2><pre class="doc-box">${esc(secondDoc || '(尚未建立)')}</pre></div>`;
      document.getElementById('panel-t4').innerHTML = html;
      if (force || mermaidDoc !== LAST_MERMAID_SRC) {
        LAST_MERMAID_SRC = mermaidDoc || '';
        renderMermaid();
      }
    }

    function renderMermaid() {
      const box = document.getElementById('mermaid-container');
      if (!box) return;
      const blocks = [...(LAST_MERMAID_SRC || '').matchAll(/```mermaid\s*([\s\S]*?)```/g)].map(m => m[1].trim());
      if (!blocks.length) { box.innerHTML = ''; return; }
      box.innerHTML = blocks.map((b, i) => `<div class="mermaid-wrap"><div class="mermaid" id="mmd-${i}">${esc(b)}</div></div>`).join('');
      if (window.mermaid) {
        try { window.mermaid.initialize({ startOnLoad: false, theme: 'dark' }); window.mermaid.run({ nodes: box.querySelectorAll('.mermaid') }); } catch (_) {}
      }
    }

    refreshState(true);
    setInterval(() => refreshState(false), 3000);
  </script>
</body>
</html>
